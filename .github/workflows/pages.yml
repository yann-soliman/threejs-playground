name: Vérification et déploiement GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-build:
    name: Vérifier et construire
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types
        run: npm run typecheck
      - name: Exécuter les tests
        run: npm test
      - name: Configurer Python pour Nantes
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer les outils de préparation Nantes
        run: pip install -r src/playgrounds/nantes-3d/scripts/requirements.txt
      - name: Vérifier les données géographiques Nantes
        run: npm run nantes:test-data
      - name: Construire la production
        run: npm run build
      - name: Préparer GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Téléverser le site compilé
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Déployer sur GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
